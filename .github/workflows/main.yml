name: Build DLL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DAIMP_SDK_DIR="${{ github.workspace }}/sdk"
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: aimp_rate_changer
          path: build/Release/aimp_rate_changer.dll
